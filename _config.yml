title: Recipes
description: A collection of recipes I like
theme: minima

# Exclude files from the site
exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock

# Set up recipes as a collection
collections:
  recipes:
    output: true
    permalink: /:name

# Default front matter for recipes
defaults:
  - scope:
      path: ""
      type: "recipes"
    values:
      layout: "page"
fonts_url: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
